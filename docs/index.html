<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>IndexedDB Practice</title>

    <style>
      .container {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
    </style>
  </head>

  <body>
    <h1>IndexedDB Practice</h1>

    <div class="container">
      <div>
        <input id="create-name" type="text" placeholder="Create name" />
        <button id="create">Create</button>
      </div>

      <div>
        <input id="read-id" type="number" placeholder="ID (空欄で全件) " />
        <button id="read">Read</button>
      </div>

      <div>
        <input id="update-id" type="number" placeholder="ID" />
        <input id="update-name" type="text" placeholder="Update name" />
        <button id="update">Update</button>
      </div>

      <div>
        <input id="delete-id" type="number" placeholder="ID (空欄で全件) " />
        <button id="delete">Delete</button>
      </div>

      <pre id="result"></pre>
    </div>

    <script src="./index.js"></script>
  </body>
</html>
